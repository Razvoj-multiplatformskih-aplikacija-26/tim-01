services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/server/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}"
          psql -h 127.0.0.1 -w -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -Atqc "SELECT to_regclass('public.review_reports') IS NOT NULL" | grep -qx t
      interval: 3s
      timeout: 5s
      retries: 15

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      PORT: 8080
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-14400}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      BACKOFFICE_WEB_ORIGIN: ${BACKOFFICE_WEB_ORIGIN:-http://localhost:8081}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  postgres_data:
